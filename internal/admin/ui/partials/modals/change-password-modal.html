  <!-- ===== Change Password Modal ===== -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal" style="max-width: 720px;">
      <div class="modal-header">
        <h3>修改密码</h3>
        <button type="button" class="modal-close" data-close="changePasswordModal" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>当前密码</label>
          <input class="form-control" id="cpOldPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
          <label>新密码 <span style="color:var(--text-muted);font-size:12px;">(至少6位)</span></label>
          <input class="form-control" id="cpNewPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label>确认新密码</label>
          <input class="form-control" id="cpConfirmPassword" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close="changePasswordModal">取消</button>
        <button class="btn btn-primary" id="savePasswordBtn">确认修改</button>
      </div>
    </div>
  </div>
