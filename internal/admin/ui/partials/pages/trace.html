        <!-- ========== Page: 请求记录 (DEBUG) ========== -->
        <div class="page" id="page-trace">
          <div class="panel">
            <div class="panel-header">
              <h3>请求记录 <span class="debug-badge">DEBUG</span></h3>
              <div class="btn-group">
                <input type="text" class="form-control" id="traceSearchId" placeholder="Request ID / Upstream ID" style="width:220px;">
                <select class="form-control" id="traceClientFilter" style="width:140px;">
                  <option value="">全部客户端</option>
                </select>
                <select class="form-control" id="traceTargetFilter" style="width:140px;">
                  <option value="">全部目标</option>
                </select>
                <select class="form-control" id="traceStatusFilter" style="width:100px;">
                  <option value="">全部状态</option>
                  <option value="2xx">2xx 成功</option>
                  <option value="4xx">4xx 客户端错误</option>
                  <option value="5xx">5xx 服务端错误</option>
                </select>
                <input type="number" class="form-control" id="traceLimit" value="50" min="1" max="5000" step="1" style="width:80px;" title="显示条数（1–5000）">
                <span class="trace-limit-hint" id="traceLimitHint" role="status" aria-live="polite"></span>
                <button class="btn" id="searchTraceBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.3-4.3"></path></svg>查询</button>
                <button class="btn" id="refreshTraceBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3a7 7 0 0 0 11.5-1"></path></svg>刷新</button>
              </div>
            </div>
            <div class="panel-body no-pad">
              <div class="trace-stats" id="traceStats"></div>
              <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>Request ID</th>
                    <th>客户端</th>
                    <th>目标</th>
                    <th>模型</th>
                    <th>状态</th>
                    <th>耗时</th>
                    <th>Tokens</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="traceTableBody">
                  <tr class="empty-row"><td colspan="9">加载中...</td></tr>
                </tbody>
              </table>
              </div>
              <div style="text-align:center;padding:10px;">
                <button class="btn" id="traceLoadMore" style="display:none;">加载更早的记录</button>
              </div>
            </div>
          </div>

          <!-- Trace Loading Overlay (braille spinner) -->
          <div class="trace-loading-overlay" id="traceLoadingOverlay" style="display:none;">
            <span class="braille-spinner" id="brailleSpinnerEl">⠋</span>
            <div class="loading-text" id="traceLoadingText">扫描历史记录...</div>
          </div>

          <!-- Trace Detail Modal -->
          <div class="modal-overlay" id="traceDetailModal" style="display:none;">
            <div class="modal" style="max-width:900px;">
              <div class="modal-header">
                <h3>请求详情</h3>
                <button type="button" class="modal-close" onclick="closeTraceDetail()" aria-label="关闭">&times;</button>
              </div>
              <div class="modal-body" id="traceDetailBody">
                <div class="loading-overlay"><span class="loading-spinner"></span> 加载中...</div>
              </div>
            </div>
          </div>
        </div>
