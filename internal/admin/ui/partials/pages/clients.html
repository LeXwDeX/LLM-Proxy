        <!-- ========== Page: 客户端管理 ========== -->
        <div class="page" id="page-clients">
          <div class="panel">
            <div class="panel-header">
              <h3>客户端管理</h3>
              <div class="btn-group">
                <input type="search" class="form-control" id="clientsSearch" placeholder="搜索名称、IP、Access Key、职级…" aria-label="搜索客户端（名称、IP、Access Key、职级）" style="width:240px;">
                <select class="form-control" id="clientsPageSize" aria-label="每页条数" title="每页条数" style="width:110px;">
                  <option value="20">20 条/页</option>
                  <option value="50" selected>50 条/页</option>
                  <option value="100">100 条/页</option>
                  <option value="200">200 条/页</option>
                </select>
                <button class="btn" id="refreshClientsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3a7 7 0 0 0 11.5-1"></path></svg>刷新</button>
                <button class="btn btn-primary readonly-hide" id="newClientBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>新增客户端</button>
              </div>
            </div>
            <div class="panel-body billing-basis-note" id="clientsBillingBasis" role="note" style="color:var(--text-muted);font-size:12px;"><strong>计费口径：</strong>费用 = 上游官方 token 用量 × 适用的价格（目标模板、全局模板或目录默认价，均无则按 0 计），系统不估算 token。</div>
            <div class="panel-body clients-usage-status" id="clientsUsageStatus" role="status" style="display:none;">
              <span id="clientsUsageStatusText">近30天用量加载中…</span>
              <button class="btn btn-sm" id="retryClientsUsageBtn" style="display:none;">重试</button>
            </div>
            <div class="panel-body no-pad table-wrap">
              <table>
                <thead id="clientsTableHead">
                  <tr>
                    <th data-sort="name">名称</th>
                    <th data-sort="ip">IP 地址</th>
                    <th data-sort="key" title="按掩码后显示的 Access Key 排序">Access Key</th>
                    <th data-sort="targets" title="按授权的目标与部署池数量排序；未限制（全部目标）排最多">允许目标</th>
                    <th data-sort="tokens">近30天 Token</th>
                    <th data-sort="cost">近30天费用</th>
                    <th data-sort="quota">额度（职级）</th>
                    <th data-sort-none>操作</th>
                  </tr>
                </thead>
<tbody id="clientsTableBody">
                   <tr class="empty-row"><td colspan="8">加载中...</td></tr>
                 </tbody>
              </table>
            </div>
            <div class="table-pagination" id="clientsPagination">
              <span class="page-info" id="clientsPageInfo"></span>
              <div class="btn-group">
                <button class="btn btn-sm" id="clientsPrevBtn">◀ 上一页</button>
                <span class="page-num" id="clientsPageNum"></span>
                <button class="btn btn-sm" id="clientsNextBtn">下一页 ▶</button>
              </div>
            </div>
          </div>
        </div>
